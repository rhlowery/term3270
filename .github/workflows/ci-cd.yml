name: CI/CD Pipeline
on: [ push, pull_request ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Add virtual display before running tests
      - name: Start virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          sudo Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Hercules TK5
        run: |
          # Start TK5 in detached mode
          docker run -d --privileged --name tk5-emulator -p 3270:3270 -p 8038:8038 ghcr.io/rhlowery/tk5-hercules
          echo "Waiting for Hercules TK5 to start..."
          timeout 120s bash -c "until curl -s http://localhost:8038 > /dev/null; do sleep 5; done"
          echo "TK5 is running"
      - name: Build with Maven
        run: ./mvnw clean install
        env:
          DISPLAY: :99
      - name: Generate Allure Report
        run: ./mvnw allure:report
        env:
          DISPLAY: :99
        if: always()
      - name: Shutdown Hercules TK5
        if: always()
        run: |
          # Stop tk5-emulator
          docker stop tk5-emulator
          docker rm tk5-emulator
